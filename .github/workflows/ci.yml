name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Node 20 fails the vitest suite regardless of minor ("TypeError:
        # object.stream is not a function" — the mocked Response lacks the
        # API surface the code uses), so CI tests the Node version the app
        # actually runs on.
        node-version: ['24']
    env:
      # Production-build values (vite.config.ts requires them for `build`;
      # mirrors .env.example). VITE_API_BASE stays unset = same-origin.
      VITE_DOMAIN: https://windowsforum.com
      VITE_TEST_DOMAIN: https://test.windowsforum.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm ls
      - run: npm run check
